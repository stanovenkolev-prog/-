<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>Безумная дорога – Компьютер</title>
  <style>
    * { margin:0; padding:0; box-sizing:border-box; }
    body { background:#111; display:flex; justify-content:center; align-items:center; height:100vh; font-family:Arial; overflow:hidden; }
    #menu {
      position:absolute; top:50%; left:50%; transform:translate(-50%,-50%);
      background:rgba(0,0,0,0.9); color:white; padding:20px; border-radius:20px;
      text-align:center; z-index:10; min-width:300px; max-width:90vw;
      max-height:80vh; overflow-y:auto;
    }
    #menu h1 { font-size:28px; margin-bottom:15px; color:#ffcc00; }
    .btn { background:#ff6600; color:white; border:none; padding:12px 30px; border-radius:30px; font-size:18px; cursor:pointer; margin:6px; transition:0.2s; box-shadow:0 4px 10px rgba(255,100,0,0.5); }
    .btn:hover { background:#ff8800; transform:scale(1.05); }
    .skin-btn { width:36px; height:36px; border-radius:50%; border:3px solid white; margin:4px; cursor:pointer; display:inline-block; transition:0.2s; }
    .skin-btn.selected { border-color:#ffcc00; transform:scale(1.2); box-shadow:0 0 12px #ffcc00; }
    .location-btn, .speed-btn, .lang-btn { background:#444; color:white; border:2px solid #888; padding:8px 14px; border-radius:12px; margin:3px; cursor:pointer; transition:0.2s; font-size:14px; }
    .location-btn.selected, .speed-btn.selected, .lang-btn.selected { border-color:#ffcc00; background:#ff6600; }
    #gameContainer { position:relative; display:none; }
    canvas { display:block; border:2px solid #fff; background:#87CEEB; }
    #info { position:absolute; bottom:10px; left:10px; color:white; background:rgba(0,0,0,0.7); padding:5px 12px; border-radius:10px; font-size:14px; }
    #score { position:absolute; top:10px; right:10px; color:white; background:rgba(0,0,0,0.7); padding:5px 12px; border-radius:10px; font-size:20px; font-weight:bold; }
    #speed { position:absolute; top:10px; left:10px; color:white; background:rgba(0,0,0,0.7); padding:5px 12px; border-radius:10px; font-size:18px; }
    #gameover { position:absolute; top:50%; left:50%; transform:translate(-50%,-50%); background:rgba(0,0,0,0.85); color:white; padding:18px 30px; border-radius:15px; text-align:center; display:none; font-size:22px; opacity:0; transition:opacity 0.3s; }
    #gameover.show { display:block; opacity:1; }
    #menuBtn { position:absolute; top:10px; left:10px; background:#ff6600; color:white; border:none; padding:6px 12px; border-radius:8px; cursor:pointer; font-size:15px; z-index:2; }
    #timeDisplay { position:absolute; top:40px; left:10px; color:white; background:rgba(0,0,0,0.7); padding:3px 10px; border-radius:8px; font-size:14px; }
    #cannonProgress { position:absolute; top:70px; left:10px; color:white; background:rgba(0,0,0,0.7); padding:3px 10px; border-radius:8px; font-size:14px; }
    #cooldownBar { position:absolute; top:95px; left:10px; height:4px; background:#ffaa00; width:0%; border-radius:2px; }
    #timeBar { position:absolute; bottom:0; left:0; height:4px; background:#ffaa00; }
    #record { position:absolute; top:10px; left:50%; transform:translateX(-50%); color:#ffcc00; background:rgba(0,0,0,0.7); padding:3px 12px; border-radius:8px; font-size:16px; }
    #credit { position:absolute; bottom:2px; right:5px; color:rgba(255,255,255,0.8); font-size:14px; text-shadow:0 0 4px black; }
  </style>
</head>
<body>
<div id="menu">
  <h1 data-lang-key="title">БЕЗУМНАЯ ДОРОГА</h1>
  <p data-lang-key="location">Локация:</p>
  <div id="locationContainer">
    <button class="location-btn selected" data-loc="Обычная" data-lang-key="normal">Обычная</button>
    <button class="location-btn" data-loc="Поле" data-lang-key="field">Поле</button>
    <button class="location-btn" data-loc="Деревня" data-lang-key="village">Деревня</button>
    <button class="location-btn" data-loc="Закат" data-lang-key="sunset">Закат</button>
  </div>
  <p data-lang-key="speed">Скорость:</p>
  <div id="speedModeContainer">
    <button class="speed-btn" data-mode="slow" data-lang-key="slow">🐢 Медленная</button>
    <button class="speed-btn selected" data-mode="normal" data-lang-key="normal_speed">🚗 Обычная</button>
    <button class="speed-btn" data-mode="fast" data-lang-key="fast">🚀 Быстрая</button>
  </div>
  <p data-lang-key="car_color">Цвет машины:</p>
  <div id="skinContainer">
    <span class="skin-btn selected" data-color="#ff4444" style="background:#ff4444;"></span>
    <span class="skin-btn" data-color="#44aaff" style="background:#44aaff;"></span>
    <span class="skin-btn" data-color="#44ff44" style="background:#44ff44;"></span>
    <span class="skin-btn" data-color="#ffaa00" style="background:#ffaa00;"></span>
    <span class="skin-btn" data-color="#ffffff" style="background:#ffffff;"></span>
  </div>
  <p data-lang-key="stripe">Полоса:</p>
  <div id="skinContainer2">
    <span class="skin-btn selected" data-color2="#ffffff" style="background:#ffffff;"></span>
    <span class="skin-btn" data-color2="#000000" style="background:#000000;"></span>
    <span class="skin-btn" data-color2="#ffff00" style="background:#ffff00;"></span>
    <span class="skin-btn" data-color2="#00ffff" style="background:#00ffff;"></span>
    <span class="skin-btn" data-color2="#ff4444" style="background:#ff4444;"></span>
  </div>
  <p data-lang-key="language">Язык:</p>
  <div id="langContainer">
    <button class="lang-btn selected" data-lang="ru">🇷🇺 Русский</button>
    <button class="lang-btn" data-lang="en">🇬🇧 English</button>
    <button class="lang-btn" data-lang="es">🇪🇸 Español</button>
    <button class="lang-btn" data-lang="fr">🇫🇷 Français</button>
  </div>
  <button class="btn" id="playBtn" data-lang-key="play">▶ ИГРАТЬ</button>
  <div style="margin-top:10px;"><span data-lang-key="record">Рекорд</span>: <span id="menuRecord">0</span> м | <span data-lang-key="cannon">Пушка</span>: <span id="menuCannon">🔫 0/20 км</span></div>
</div>
<div id="gameContainer">
  <canvas id="game" width="400" height="600"></canvas>
  <button id="menuBtn">Меню</button>
  <div id="speed">0 км/ч</div>
  <div id="timeDisplay">День</div>
  <div id="score">0 м</div>
  <div id="cannonProgress">🔫 0/20 км</div>
  <div id="cooldownBar"></div>
  <div id="record">🏆 0 м</div>
  <div id="timeBar"></div>
  <div id="credit">Разработчик: Лев Становенко</div>
  <div id="info" data-lang-key="controls">⬅➡ руль | ⬆ газ | ⬇ тормоз | ПРОБЕЛ/КЛИК — огонь</div>
  <div id="gameover" data-lang-key="gameover">АВАРИЯ!<br>Нажмите ПРОБЕЛ или КЛИК для рестарта</div>
</div>

  // ... весь игровой код из предыдущего ответа ...
</script>
</body>
</html>
