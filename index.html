<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>Безумная дорога</title>
  <style>
    * { margin:0; padding:0; box-sizing:border-box; }
    body { background:#111; display:flex; justify-content:center; align-items:center; height:100vh; font-family:Arial; overflow:hidden; }
    #menu { position:absolute; top:50%; left:50%; transform:translate(-50%,-50%); background:rgba(0,0,0,0.9); color:white; padding:25px; border-radius:20px; text-align:center; z-index:10; min-width:350px; }
    #menu h1 { font-size:34px; margin-bottom:20px; color:#ffcc00; }
    .btn { background:#ff6600; color:white; border:none; padding:12px 30px; border-radius:30px; font-size:18px; cursor:pointer; margin:6px; transition:0.2s; box-shadow:0 4px 10px rgba(255,100,0,0.5); }
    .btn:hover { background:#ff8800; transform:scale(1.05); }
    .skin-btn { width:40px; height:40px; border-radius:50%; border:3px solid white; margin:5px; cursor:pointer; display:inline-block; transition:0.2s; }
    .skin-btn.selected { border-color:#ffcc00; transform:scale(1.2); box-shadow:0 0 12px #ffcc00; }
    .location-btn, .speed-btn { background:#444; color:white; border:2px solid #888; padding:8px 18px; border-radius:12px; margin:4px; cursor:pointer; transition:0.2s; }
    .location-btn.selected, .speed-btn.selected { border-color:#ffcc00; background:#ff6600; }
    #gameContainer { position:relative; display:none; }
    canvas { display:block; border:2px solid #fff; background:#87CEEB; }
    #info { position:absolute; bottom:10px; left:10px; color:white; background:rgba(0,0,0,0.7); padding:5px 12px; border-radius:10px; font-size:14px; }
    #score { position:absolute; top:10px; right:10px; color:white; background:rgba(0,0,0,0.7); padding:5px 12px; border-radius:10px; font-size:20px; font-weight:bold; }
    #speed { position:absolute; top:10px; left:10px; color:white; background:rgba(0,0,0,0.7); padding:5px 12px; border-radius:10px; font-size:18px; }
    #gameover { position:absolute; top:50%; left:50%; transform:translate(-50%,-50%); background:rgba(0,0,0,0.85); color:white; padding:18px 30px; border-radius:15px; text-align:center; display:none; font-size:22px; opacity:0; transition:opacity 0.3s; }
    #gameover.show { display:block; opacity:1; }
    #timeDisplay { position:absolute; top:40px; left:10px; color:white; background:rgba(0,0,0,0.7); padding:3px 10px; border-radius:8px; font-size:14px; }
    #cannonProgress { position:absolute; top:70px; left:10px; color:white; background:rgba(0,0,0,0.7); padding:3px 10px; border-radius:8px; font-size:14px; }
    #cooldownBar { position:absolute; top:95px; left:10px; height:4px; background:#ffaa00; width:0%; border-radius:2px; }
    #timeBar { position:absolute; bottom:0; left:0; height:4px; background:#ffaa00; }
    #record { position:absolute; top:10px; left:50%; transform:translateX(-50%); color:#ffcc00; background:rgba(0,0,0,0.7); padding:3px 12px; border-radius:8px; font-size:16px; }
  </style>
</head>
<body>
<div id="menu">
  <h1>БЕЗУМНАЯ ДОРОГА</h1>
  <p>Локация:</p>
  <div id="locationContainer">
    <button class="location-btn selected" data-loc="Обычная">Обычная</button>
    <button class="location-btn" data-loc="Поле">Поле</button>
    <button class="location-btn" data-loc="Деревня">Деревня</button>
    <button class="location-btn" data-loc="Закат">Закат</button>
  </div>
  <p>Скорость:</p>
  <div id="speedModeContainer">
    <button class="speed-btn" data-mode="slow">🐢 Медленная</button>
    <button class="speed-btn selected" data-mode="normal">🚗 Обычная</button>
    <button class="speed-btn" data-mode="fast">🚀 Быстрая</button>
  </div>
  <p>Цвет машины:</p>
  <div id="skinContainer">
    <span class="skin-btn selected" data-color="#ff4444" style="background:#ff4444;"></span>
    <span class="skin-btn" data-color="#44aaff" style="background:#44aaff;"></span>
    <span class="skin-btn" data-color="#44ff44" style="background:#44ff44;"></span>
    <span class="skin-btn" data-color="#ffaa00" style="background:#ffaa00;"></span>
    <span class="skin-btn" data-color="#ff44ff" style="background:#ff44ff;"></span>
    <span class="skin-btn" data-color="#ffffff" style="background:#ffffff;"></span>
  </div>
  <p>Полоса:</p>
  <div id="skinContainer2">
    <span class="skin-btn selected" data-color2="#ffffff" style="background:#ffffff;"></span>
    <span class="skin-btn" data-color2="#000000" style="background:#000000;"></span>
    <span class="skin-btn" data-color2="#ffff00" style="background:#ffff00;"></span>
    <span class="skin-btn" data-color2="#00ffff" style="background:#00ffff;"></span>
    <span class="skin-btn" data-color2="#ff4444" style="background:#ff4444;"></span>
  </div>
  <button class="btn" id="playBtn">▶ ИГРАТЬ</button>
  <div style="margin-top:10px;">Рекорд: <span id="menuRecord">0</span> м | Пушка: <span id="menuCannon">🔫 0/20 км</span></div>
</div>
<div id="gameContainer">
  <canvas id="game" width="400" height="600"></canvas>
  <div id="speed">60 км/ч</div>
  <div id="timeDisplay">День</div>
  <div id="score">0 м</div>
  <div id="cannonProgress">🔫 0/20 км</div>
  <div id="cooldownBar"></div>
  <div id="record">🏆 0 м</div>
  <div id="timeBar"></div>
  <div id="info">⬅➡ — руль | ⬆ — газ | ⬇ — тормоз | ПРОБЕЛ/КЛИК — стрельба | ESC — меню</div>
  <div id="gameover">АВАРИЯ!<br>ПРОБЕЛ или КЛИК — заново</div>
</div>

<script>
  const canvas = document.getElementById('game');
  const ctx = canvas.getContext('2d');
  const W = canvas.width, H = canvas.height;

  const menuDiv = document.getElementById('menu');
  const gameContainer = document.getElementById('gameContainer');
  const gameoverDiv = document.getElementById('gameover');
  const timeDisplay = document.getElementById('timeDisplay');
  const speedDisplay = document.getElementById('speed');
  const cannonProgress = document.getElementById('cannonProgress');
  const cooldownBar = document.getElementById('cooldownBar');
  const recordDisplay = document.getElementById('record');
  const menuRecord = document.getElementById('menuRecord');
  const menuCannon = document.getElementById('menuCannon');
  const timeBar = document.getElementById('timeBar');
  const achievementDiv = document.createElement('div');

  let gameRunning = false;
  let playerColor1 = '#ff4444', playerColor2 = '#ffffff';
  let currentLocation = 'Обычная', currentSpeedMode = 'normal';
  let recordDistance = parseInt(localStorage.getItem('roadRecord')) || 0;
  let totalDistance = parseFloat(localStorage.getItem('roadTotalDistance')) || 0;
  let distance = 0;
  menuRecord.textContent = recordDistance;
  updateMenuCannon();

  const lanes = [60, 120, 180, 240, 300, 350];
  let roadOffset = 0;
  let enemies = [], houses = [], bullets = [], bonuses = [], particles = [];
  let enemyBaseSpeed = 4, gameOverTimer = 0, enemiesDestroyed = 0;
  let lastSpawnDist = 0, lastHouseDist = 0, lastBonusDist = 0;

  const player = {
    x: W/2, y: H - 100, w: 40, h: 70,
    speed: 4, targetSpeed: 4, vx: 0, alive: true,
    cannonUnlocked: false, shootCooldown: 0, maxShootCooldown: 15,
    shield: false, boost: false, repair: false, drift: 0
  };

  const speedModes = {
    slow: { name:'Медленная', playerBase:2, playerBoost:3, enemyCoeff:0.5 },
    normal: { name:'Обычная', playerBase:4, playerBoost:6.5, enemyCoeff:1 },
    fast: { name:'Быстрая', playerBase:6, playerBoost:9, enemyCoeff:1.5 }
  };
  function getMode() { return speedModes[currentSpeedMode]; }

  // Звук
  let audioCtx=null, engineOsc=null, engineGain=null;
  function initAudio() { if (!audioCtx) audioCtx = new (window.AudioContext||window.webkitAudioContext)(); else audioCtx.resume(); }
  function startEngine() {
    if (!audioCtx) return;
    if (engineOsc) engineOsc.stop();
    engineOsc = audioCtx.createOscillator();
    engineGain = audioCtx.createGain();
    engineOsc.type='sawtooth'; engineOsc.frequency.value=80; engineGain.gain.value=0.06;
    engineOsc.connect(engineGain); engineGain.connect(audioCtx.destination); engineOsc.start();
  }
  function stopEngine() { if (engineOsc) { engineOsc.stop(); engineOsc=null; engineGain=null; } }
  function updateEngine(speed) {
    if (!engineOsc) return;
    engineOsc.frequency.setTargetAtTime(55+speed*12, audioCtx.currentTime, 0.1);
    engineGain.gain.setTargetAtTime(Math.min(0.1, speed*0.02), audioCtx.currentTime, 0.1);
  }
  function playSound(freq, type, dur, vol=0.1) {
    if (!audioCtx) return;
    if (audioCtx.state==='suspended') audioCtx.resume();
    const o=audioCtx.createOscillator(), g=audioCtx.createGain();
    o.type=type; o.frequency.value=freq;
    g.gain.setValueAtTime(vol, audioCtx.currentTime);
    g.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime+dur);
    o.connect(g); g.connect(audioCtx.destination); o.start(); o.stop(audioCtx.currentTime+dur);
  }
  window.addEventListener('click', initAudio, {once:true});
  window.addEventListener('keydown', initAudio, {once:true});

  // Пулы
  function spawnEnemy(yPos=-100) {
    const set = locSettings[currentLocation];
    const lane = lanes[Math.floor(Math.random() * lanes.length)];
    const type = set.enemyTypes[Math.floor(Math.random() * set.enemyTypes.length)];
    const coeff = getMode().enemyCoeff;
    let w,h,s;
    switch(type) {
      case 'car': w=40; h=70; s=enemyBaseSpeed*coeff; break;
      case 'tractor': w=50; h=80; s=enemyBaseSpeed*0.8*coeff; break;
      case 'combine': w=60; h=100; s=enemyBaseSpeed*0.6*coeff; break;
      case 'horse': w=40; h=70; s=enemyBaseSpeed*1.3*coeff; break;
      case 'cow': w=50; h=75; s=enemyBaseSpeed*0.9*coeff; break;
      default: w=40; h=70; s=enemyBaseSpeed*coeff;
    }
    enemies.push({ x:lane, y:yPos, w, h, speed:s, type, lane, color:type==='car'?`hsl(${Math.random()*360},70%,50%)`:null, timer:0 });
  }
  function spawnHouse(yPos=-100) {
    if (!locSettings[currentLocation].house) return;
    houses.push({ x:lanes[Math.floor(Math.random()*lanes.length)], y:yPos, w:50, h:60 });
  }
  function spawnBonus(yPos=-100) {
    const t = ['shield','boost','repair'][Math.floor(Math.random()*3)];
    bonuses.push({ x:lanes[Math.floor(Math.random()*lanes.length)], y:yPos, w:30, h:30, type:t });
  }
  function createParticles(x,y,count,color=null) {
    for (let i=0;i<count;i++) {
      particles.push({ x,y, vx:(Math.random()-0.5)*10, vy:(Math.random()-0.5)*10-2, size:3+Math.random()*5, color:color||`hsl(${Math.random()*60+20},80%,60%)`, life:1 });
    }
  }
  function shootBullet() { bullets.push({ x:player.x, y:player.y-30, w:6, h:16, speed:12 }); playSound(800,'square',0.1,0.2); }

  function rect(r1,r2) { return !(r1.x+r1.w<r2.x || r1.x>r2.x+r2.w || r1.y+r1.h<r2.y || r1.y>r2.y+r2.h); }

  function checkCollisions() {
    if (!player.alive) return;
    const p = { x:player.x-player.w/2, y:player.y-player.h/2, w:player.w, h:player.h };
    for (let i=bonuses.length-1;i>=0;i--) {
      const b = bonuses[i], r={ x:b.x-b.w/2, y:b.y-b.h/2, w:b.w, h:b.h };
      if (rect(p,r)) {
        if (b.type==='shield') { player.shield=true; setTimeout(()=>{player.shield=false;},8000); }
        else if (b.type==='boost') { player.targetSpeed=8; setTimeout(()=>{player.targetSpeed=4;},6000); }
        else if (b.type==='repair') { player.repair=true; setTimeout(()=>{player.repair=false;},10000); }
        bonuses.splice(i,1); playSound(500,'sine',0.15,0.3);
      }
    }
    for (let i=enemies.length-1;i>=0;i--) {
      const e = enemies[i]; if (e.timer>0) continue;
      if (rect(p, { x:e.x-e.w/2, y:e.y-e.h/2, w:e.w, h:e.h })) {
        if (player.shield) { createParticles(e.x,e.y,10,'#00ff00'); enemies.splice(i,1); continue; }
        if (player.repair) { player.repair=false; createParticles(e.x,e.y,10,'#ff0000'); enemies.splice(i,1); continue; }
        if (e.type==='cow') { e.type='steak'; e.timer=60; e.speed=0; gameOverTimer=45; }
        else if (e.type==='horse') { e.type='hay'; e.timer=60; e.speed=0; gameOverTimer=45; }
        else { gameOverTimer=45; }
        player.alive=false; gameoverDiv.classList.add('show'); createParticles(e.x,e.y,15);
        playSound(100,'sawtooth',0.2,0.5); saveTotalDistance(); return;
      }
    }
    for (let house of houses) {
      if (rect(p, { x:house.x-house.w/2, y:house.y-house.h/2, w:house.w, h:house.h })) {
        player.alive=false; gameOverTimer=45; gameoverDiv.classList.add('show');
        createParticles(house.x,house.y,15); playSound(80,'sawtooth',0.3,0.4); saveTotalDistance(); return;
      }
    }
    for (let i=bullets.length-1;i>=0;i--) {
      const b = bullets[i]; let hit=false;
      for (let j=enemies.length-1;j>=0;j--) {
        const e = enemies[j]; if (e.type==='steak'||e.type==='hay') continue;
        if (rect({ x:b.x-b.w/2, y:b.y-b.h/2, w:b.w, h:b.h }, { x:e.x-e.w/2, y:e.y-e.h/2, w:e.w, h:e.h })) {
          enemies.splice(j,1); bullets.splice(i,1); createParticles(e.x,e.y,10); playSound(600,'square',0.1,0.2); hit=true; break;
        }
      }
      if (!hit && (b.y<-20 || b.y>H+20)) bullets.splice(i,1);
    }
  }

  function saveTotalDistance() { localStorage.setItem('roadTotalDistance', totalDistance); updateMenuCannon(); }
  function updateMenuCannon() {
    const p = Math.min(totalDistance/1000,20).toFixed(1);
    menuCannon.textContent = totalDistance>=20000 ? '🔫 ГОТОВО' : `🔫 ${p}/20 км`;
  }

  function getTimeOfDay() {
    const s = locSettings[currentLocation];
    if (!s.timeChange) return s.fixedTime||'day';
    const km = totalDistance/1000;
    if (km<5) return 'day'; if (km<10) return 'night';
    if (km<11.5) return 'morning'; if (km<13) return 'day';
    if (km<14.5) return 'evening';
    const cycle = (km-14.5)%9.5;
    if (cycle<5) return 'night'; if (cycle<6.5) return 'morning';
    if (cycle<8) return 'day'; return 'evening';
  }

  const locSettings = {
    'Обычная': { enemyTypes:['car'], house:true, deco:['tree','lamp'], baseSpeed:4, spawnInterval:110, houseInterval:480, bonusInterval:800, timeChange:true },
    'Поле': { enemyTypes:['tractor','combine'], house:false, deco:['wheat','oat'], baseSpeed:2.5, spawnInterval:160, bonusInterval:1000, timeChange:false },
    'Деревня': { enemyTypes:['horse','cow'], house:false, deco:['house','fence'], baseSpeed:3, spawnInterval:140, bonusInterval:900, timeChange:false, fixedTime:'evening' },
    'Закат': { enemyTypes:['car'], house:true, deco:['tree','lamp'], baseSpeed:4, spawnInterval:110, houseInterval:480, bonusInterval:800, timeChange:false, fixedTime:'sunset' }
  };

  function update(dt) {
    const frameDt = Math.min(0.05, dt);
    if (!player.alive) {
      if (gameOverTimer>0) { gameOverTimer--; moveWorld(frameDt); updateParticles(frameDt); if (gameOverTimer<=0) stopEngine(); }
      return;
    }
    const mode = getMode();
    player.targetSpeed = mode.playerBase;
    if (keys['ArrowUp']) player.targetSpeed = mode.playerBoost;
    if (keys['ArrowDown']) player.targetSpeed = Math.max(1, mode.playerBase-1.5);
    player.speed += (player.targetSpeed-player.speed)*Math.min(1,frameDt*4);
    updateEngine(player.speed);
    player.vx = (keys['ArrowLeft']?-3:0)+(keys['ArrowRight']?3:0);
    player.x += player.vx*frameDt*60; player.x = Math.max(30, Math.min(W-30, player.x));
    const scrollSpeed = player.speed*frameDt*60;
    roadOffset += scrollSpeed; if (roadOffset>40) roadOffset-=40;
    distance += scrollSpeed*0.5; totalDistance += scrollSpeed*0.5;
    if (Math.floor(totalDistance/200) > Math.floor((totalDistance-scrollSpeed*0.5)/200)) saveTotalDistance();
    document.getElementById('score').textContent = Math.floor(distance)+' м';
    speedDisplay.textContent = Math.floor(player.speed*60*3.6/10)+' км/ч';
    player.cannonUnlocked = totalDistance>=20000;
    cannonProgress.textContent = player.cannonUnlocked?'🔫 ГОТОВО':`🔫 ${Math.min(totalDistance/1000,20).toFixed(1)}/20 км`;
    if (player.shootCooldown>0) { player.shootCooldown--; cooldownBar.style.width = ((player.maxShootCooldown-player.shootCooldown)/player.maxShootCooldown*100)+'%'; }
    else cooldownBar.style.width = '100%';
    enemyBaseSpeed = locSettings[currentLocation].baseSpeed*(1+Math.floor(totalDistance/500)*0.1);
    const set = locSettings[currentLocation];
    if (totalDistance-lastSpawnDist > set.spawnInterval) { spawnEnemy(); lastSpawnDist=totalDistance; }
    if (set.house && totalDistance-lastHouseDist > set.houseInterval) { spawnHouse(); lastHouseDist=totalDistance; }
    if (totalDistance-lastBonusDist > set.bonusInterval) { spawnBonus(); lastBonusDist=totalDistance; }
    moveWorld(frameDt);
    const tod = getTimeOfDay(); timeDisplay.textContent = {day:'День', night:'Ночь', morning:'Утро', evening:'Вечер', sunset:'Закат'}[tod]||'День';
    timeBar.style.width = ((totalDistance%1000)/10)+'%';
    if (distance>recordDistance) { recordDistance=Math.floor(distance); localStorage.setItem('roadRecord', recordDistance); menuRecord.textContent=recordDistance; }
    recordDisplay.textContent = '🏆 '+recordDistance+' м';
    canvas.style.filter = player.speed>mode.playerBase? `blur(${Math.min(2,(player.speed-mode.playerBase)*0.7)}px)`:'none';
    checkCollisions();
  }

  function moveWorld(dt) {
    for (let i=enemies.length-1;i>=0;i--) {
      const e = enemies[i]; if (e.timer>0) { e.timer--; if (e.timer<=0) enemies.splice(i,1); }
      else { e.y += e.speed*dt*60; if (e.y>H+150) enemies.splice(i,1); }
    }
    for (let h of houses) h.y += player.speed*dt*60; houses = houses.filter(h=>h.y<H+200);
    for (let b of bullets) b.y -= b.speed*dt*60; bullets = bullets.filter(b=>b.y>-50);
    for (let b of bonuses) b.y += player.speed*dt*60; bonuses = bonuses.filter(b=>b.y<H+200);
  }
  function updateParticles(dt) {
    for (let i=particles.length-1;i>=0;i--) {
      const p = particles[i]; p.x+=p.vx*dt*60; p.y+=p.vy*dt*60; p.vy+=0.3*dt*60; p.life-=0.02*dt*60;
      if (p.life<=0) particles.splice(i,1);
    }
  }

  // Отрисовка
  function drawCar(x,y,w,h,c1,c2) {
    ctx.save(); ctx.translate(x,y);
    ctx.fillStyle='rgba(0,0,0,0.3)'; ctx.beginPath(); ctx.roundRect(-w/2+3,-h/2+3,w,h,10); ctx.fill();
    ctx.fillStyle=c1; ctx.beginPath(); ctx.roundRect(-w/2,-h/2,w,h,10); ctx.fill();
    ctx.fillStyle=c2; ctx.fillRect(-w/2+6,-h/2+4,w-12,7); ctx.fillRect(-w/2+6,h/2-11,w-12,7);
    ctx.fillStyle='#aaddff'; ctx.beginPath(); ctx.roundRect(-8,-15,8,10,2); ctx.fill(); ctx.beginPath(); ctx.roundRect(4,-15,8,10,2); ctx.fill();
    ctx.fillStyle='#ffff99'; ctx.beginPath(); ctx.arc(-w/2+8,-h/2+8,4,0,Math.PI*2); ctx.fill(); ctx.beginPath(); ctx.arc(w/2-8,-h/2+8,4,0,Math.PI*2); ctx.fill();
    ctx.fillStyle='#111'; ctx.beginPath(); ctx.ellipse(-w/2+8,h/2-5,6,8,0,0,Math.PI*2); ctx.fill(); ctx.beginPath(); ctx.ellipse(w/2-8,h/2-5,6,8,0,0,Math.PI*2); ctx.fill();
    ctx.fillStyle='#555'; ctx.beginPath(); ctx.ellipse(-w/2+8,h/2-5,3,4,0,0,Math.PI*2); ctx.fill(); ctx.beginPath(); ctx.ellipse(w/2-8,h/2-5,3,4,0,0,Math.PI*2); ctx.fill();
    ctx.restore();
  }

  function drawRoad() {
    const tod = getTimeOfDay();
    if (tod==='sunset') {
      const g=ctx.createLinearGradient(0,0,0,H); g.addColorStop(0,'#8B00FF'); g.addColorStop(0.4,'#FF69B4'); g.addColorStop(0.7,'#FF8C00'); g.addColorStop(1,'#FF0000');
      ctx.fillStyle=g; ctx.fillRect(0,0,W,H);
      ctx.fillStyle='#8B4513'; ctx.fillRect(0,0,20,H); ctx.fillRect(W-20,0,20,H);
      ctx.fillStyle='#3E2723'; ctx.fillRect(20,0,W-40,H);
    } else {
      const cfg = {day:['#87CEEB','#4caf50','#444'], night:['#12121a','#1a2e1a','#222'], morning:['#ffe4b5','#6b8e23','#555'], evening:['#ff7f50','#556b2f','#3a3a3a']};
      const [bg,grass,road] = cfg[tod]||cfg.day;
      ctx.fillStyle=bg; ctx.fillRect(0,0,W,H);
      ctx.fillStyle=grass; ctx.fillRect(0,0,20,H); ctx.fillRect(W-20,0,20,H);
      ctx.fillStyle=road; ctx.fillRect(20,0,W-40,H);
    }
    ctx.strokeStyle='#fff'; ctx.lineWidth=2;
    for (let i=0;i<lanes.length-1;i++) for (let y=-roadOffset; y<H; y+=50) { ctx.beginPath(); ctx.moveTo((lanes[i]+lanes[i+1])/2,y); ctx.lineTo((lanes[i]+lanes[i+1])/2,y+30); ctx.stroke(); }
    ctx.lineWidth=3; ctx.beginPath(); ctx.moveTo(20,0); ctx.lineTo(20,H); ctx.moveTo(W-20,0); ctx.lineTo(W-20,H); ctx.stroke();
  }

  function draw() {
    ctx.clearRect(0,0,W,H);
    drawRoad();
    for (let e of enemies) drawEnemy(e);
    for (let h of houses) {
      ctx.fillStyle='#d4a373'; ctx.beginPath(); ctx.roundRect(h.x-h.w/2,h.y-h.h/2,h.w,h.h,8); ctx.fill();
      ctx.fillStyle='#8b4513'; ctx.beginPath(); ctx.moveTo(h.x-h.w/2-5,h.y-h.h/2); ctx.lineTo(h.x,h.y-h.h/2-20); ctx.lineTo(h.x+h.w/2+5,h.y-h.h/2); ctx.fill();
      ctx.fillStyle='#87CEEB'; ctx.beginPath(); ctx.roundRect(h.x-10,h.y-8,8,8,1); ctx.fill();
    }
    for (let b of bonuses) {
      ctx.save(); ctx.translate(b.x,b.y);
      if (b.type==='shield') { ctx.fillStyle='#0f0'; ctx.beginPath(); ctx.arc(0,0,15,0,Math.PI*2); ctx.fill(); ctx.fillStyle='#fff'; ctx.fillText('🛡️',-8,6); }
      else if (b.type==='boost') { ctx.fillStyle='#ff0'; ctx.beginPath(); ctx.arc(0,0,15,0,Math.PI*2); ctx.fill(); ctx.fillText('🚀',-8,6); }
      else { ctx.fillStyle='#f00'; ctx.beginPath(); ctx.arc(0,0,15,0,Math.PI*2); ctx.fill(); ctx.fillText('🔧',-8,6); }
      ctx.restore();
    }
    ctx.fillStyle='#ffaa00'; for (let b of bullets) ctx.fillRect(b.x-b.w/2,b.y-b.h/2,b.w,b.h);
    if (player.alive) drawCar(player.x,player.y,player.w,player.h,playerColor1,playerColor2);
    for (let p of particles) { ctx.globalAlpha=p.life; ctx.fillStyle=p.color; ctx.beginPath(); ctx.arc(p.x,p.y,p.size,0,Math.PI*2); ctx.fill(); }
    ctx.globalAlpha=1;
  }

  function drawEnemy(e) {
    switch(e.type) {
      case 'car': drawCar(e.x,e.y,e.w,e.h,e.color,'#fff'); break;
      case 'tractor': ctx.fillStyle='#8B4513'; ctx.fillRect(e.x-e.w/2,e.y-e.h/2,e.w,e.h); break;
      case 'combine': ctx.fillStyle='#B22222'; ctx.fillRect(e.x-e.w/2,e.y-e.h/2,e.w,e.h); break;
      case 'horse': ctx.fillStyle='#8B4513'; ctx.fillRect(e.x-15,e.y-25,30,50); break;
      case 'cow': ctx.fillStyle='#FFF'; ctx.fillRect(e.x-18,e.y-30,36,60); break;
      case 'steak': ctx.fillStyle='#8B4513'; ctx.fillRect(e.x-15,e.y-10,30,20); break;
      case 'hay': ctx.fillStyle='#DAA520'; ctx.fillRect(e.x-15,e.y-10,30,20); break;
    }
  }

  let lastTime = performance.now();
  function gameLoop(now) {
    const dt = (now-lastTime)/1000; lastTime=now;
    if (gameRunning) { update(dt); draw(); }
    requestAnimationFrame(gameLoop);
  }

  function resetGame() {
    const mode = getMode();
    player.alive=true; player.x=W/2; player.y=H-100; player.speed=mode.playerBase; player.targetSpeed=mode.playerBase;
    player.vx=0; enemies=[]; houses=[]; bullets=[]; bonuses=[]; particles=[]; distance=0;
    lastSpawnDist=totalDistance; lastHouseDist=totalDistance; lastBonusDist=totalDistance;
    gameoverDiv.classList.remove('show'); gameOverTimer=0;
    for (let i=0;i<2;i++) spawnEnemy(-i*200);
    startEngine();
  }

  function startGame() {
    initAudio(); menuDiv.style.display='none'; gameContainer.style.display='block'; gameRunning=true; resetGame();
  }

  function goToMenu() {
    gameRunning=false; gameContainer.style.display='none'; menuDiv.style.display='block'; menuRecord.textContent=recordDistance; updateMenuCannon(); stopEngine();
  }

  // Меню
  document.querySelectorAll('#skinContainer .skin-btn').forEach(b=>b.addEventListener('click', ()=>{ document.querySelectorAll('#skinContainer .skin-btn').forEach(x=>x.classList.remove('selected')); b.classList.add('selected'); playerColor1=b.dataset.color; }));
  document.querySelectorAll('#skinContainer2 .skin-btn').forEach(b=>b.addEventListener('click', ()=>{ document.querySelectorAll('#skinContainer2 .skin-btn').forEach(x=>x.classList.remove('selected')); b.classList.add('selected'); playerColor2=b.dataset.color2; }));
  document.querySelectorAll('.location-btn').forEach(b=>b.addEventListener('click', ()=>{ document.querySelectorAll('.location-btn').forEach(x=>x.classList.remove('selected')); b.classList.add('selected'); currentLocation=b.dataset.loc; }));
  document.querySelectorAll('.speed-btn').forEach(b=>b.addEventListener('click', ()=>{
    document.querySelectorAll('.speed-btn').forEach(x=>x.classList.remove('selected'));
    b.classList.add('selected');
    currentSpeedMode = b.dataset.mode;
  }));

  document.getElementById('playBtn').addEventListener('click', startGame);
  window.addEventListener('keydown', e=>{ if (e.key==='Escape'&&gameRunning) goToMenu(); });

  const keys = {};
  window.addEventListener('keydown', e=>{
    keys[e.key]=true; e.preventDefault();
    if (e.key===' '&&gameRunning) {
      if (player.alive && player.cannonUnlocked && player.shootCooldown<=0) { shootBullet(); player.shootCooldown=player.maxShootCooldown; }
      else if (!player.alive && gameOverTimer<=0) resetGame();
    }
    if (e.key==='Escape'&&gameRunning) goToMenu();
  });
  window.addEventListener('keyup', e=>{ keys[e.key]=false; e.preventDefault(); });
  canvas.addEventListener('click', ()=>{
    if (!gameRunning) return;
    if (player.alive && player.cannonUnlocked && player.shootCooldown<=0) { shootBullet(); player.shootCooldown=player.maxShootCooldown; }
    else if (!player.alive && gameOverTimer<=0) resetGame();
  });

  if (!ctx.roundRect) {
    ctx.roundRect = function(x,y,w,h,r) {
      if (typeof r==='number') r={tl:r,tr:r,br:r,bl:r};
      ctx.beginPath(); ctx.moveTo(x+r.tl,y); ctx.lineTo(x+w-r.tr,y); ctx.quadraticCurveTo(x+w,y,x+w,y+r.tr);
      ctx.lineTo(x+w,y+h-r.br); ctx.quadraticCurveTo(x+w,y+h,x+w-r.br,y+h); ctx.lineTo(x+r.bl,y+h);
      ctx.quadraticCurveTo(x,y+h,x,y+h-r.bl); ctx.lineTo(x,y+r.tl); ctx.quadraticCurveTo(x,y,x+r.tl,y); ctx.closePath();
    };
  }

  requestAnimationFrame(gameLoop);
</script>
</body>
</html>
